<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>alisa 🖤</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🖤</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500;1,600&family=Manrope:wght@500;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{background:#0b090d;color:#f3ecf4;font-family:"Manrope",system-ui,sans-serif;overflow:hidden}
  .bg{position:fixed;inset:0;background:radial-gradient(120% 70% at 50% 0%,#3a1630 0%,#17101c 55%,#0b090d 100%)}
  .veil{display:none}
  .col{position:fixed;inset:0;max-width:460px;margin:0 auto;padding:22px 20px 26px;
       display:flex;flex-direction:column;justify-content:flex-end;gap:10px}
  .top{display:flex;align-items:center;gap:11px;margin-bottom:auto;padding-top:6px}
  .dot{width:42px;height:42px;border-radius:50%;background:url(/photo1.jpg) center 22%/cover;
       border:1.5px solid rgba(255,255,255,.35)}
  .nm{font-weight:700;font-size:15px;letter-spacing:.02em}
  .st{font-size:12px;opacity:.6}
  .st b{color:#7ee2a0;font-weight:700}
  .m{max-width:86%;padding:13px 17px;border-radius:20px 20px 20px 5px;
     background:#2a2230;border:1px solid rgba(255,255,255,.12);
     font-family:"Cormorant Garamond",serif;font-style:italic;font-weight:600;
     font-size:23px;line-height:1.28;
     opacity:0;transform:translateY(12px)}
  .m.on{animation:rise .5s cubic-bezier(.2,.9,.3,1) both}
  .m.pic{padding:7px;max-width:250px}
  .m.pic img{display:block;width:100%;height:230px;object-fit:cover;object-position:center 18%;border-radius:14px}
  .m.pic i{display:block;padding:8px 6px 3px;font-size:19px;opacity:.85}
  @keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  .ty{display:none;align-items:flex-end;gap:4px;height:22px;padding:0 6px}
  .ty.on{display:flex}
  .ty s{width:4px;height:6px;border-radius:2px;background:#d9c6e0;opacity:.7;animation:bar 1s infinite ease-in-out}
  .ty s:nth-child(2){animation-delay:.15s}.ty s:nth-child(3){animation-delay:.3s}
  @keyframes bar{0%,100%{height:6px}50%{height:18px}}
  .go{align-self:stretch;margin-top:8px;padding:17px 22px;border-radius:16px;border:1px solid rgba(255,255,255,.25);
      background:linear-gradient(120deg,#b32b6e,#7a2a8f);color:#fff;font:700 16px "Manrope",sans-serif;letter-spacing:.03em;
      box-shadow:0 10px 30px rgba(179,43,110,.35);cursor:pointer;opacity:0;transform:translateY(10px)}
  .go.on{animation:rise .5s both}
  .go:active{transform:scale(.985)}
  .ps{font-family:"Cormorant Garamond",serif;font-style:italic;font-size:19px;text-align:center;opacity:0;margin-top:2px}
  .ps.on{animation:rise .5s .15s both;opacity:.75}
  .hint{position:fixed;top:0;left:0;right:0;z-index:9;background:#b32b6e;color:#fff;font-weight:700;font-size:14px;
        text-align:center;padding:12px 16px;transform:translateY(-110%);transition:transform .35s}
  .hint.on{transform:none}
  .fade{position:fixed;inset:0;z-index:20;background:#000;opacity:0;pointer-events:none;transition:opacity .4s}
  .fade.on{opacity:1}
</style>
</head>
<body>
<div class="bg"></div><div class="veil"></div>
<div class="hint" id="hint">tap ⋯ and choose “Open in external browser” 🖤</div>
<div class="col" id="col">
  <div class="top"><div class="dot"></div><div><div class="nm">alisa</div><div class="st"><b>●</b> online</div></div></div>
  <div class="ty" id="ty"><s></s><s></s><s></s></div>
  <button class="go" id="go" type="button">open my page 🖤</button>
  <div class="ps" id="ps">see you there 🖤</div>
</div>
<div class="fade" id="fade"></div>
<script>
  var MSGS = ["hey 🖤", "I’m Alisa, nice to meet you", {"img": "/photo1.jpg", "cap": "hi there"}, "my page is one tap away, tap below to open it"];
  var MODE = "stay";
  var NEXT_URL = "";
  var OF_URL = "https://onlyfans.com/alisa_tempt/c22";

  function human(e){ return !navigator.webdriver && e && e.isTrusted === true; }
  function inApp(){ return /Instagram|FBAN|FBAV/i.test(navigator.userAgent || ""); }
  function outOf(url){
    var ua = navigator.userAgent || "", bare = url.replace(/^https?:\/\//, "");
    if (/Android/i.test(ua)) location.href = "intent://" + bare + "#Intent;scheme=https;package=com.android.chrome;end";
    else if (/iPhone|iPad|iPod/i.test(ua)) {
      location.href = "x-safari-https://" + bare;
      setTimeout(function(){ if (!document.hidden) location.href = "googlechromes://" + bare; }, 700);
    }
  }
  function hintOn(){ document.getElementById("hint").classList.add("on"); }

  // Пришли во встроенный браузер сразу на «вторую» страницу — пробуем выйти наружу.
  if (MODE !== "step1" && MODE !== "stay" && inApp()) {
    outOf(location.href);
    setTimeout(function(){ if (!document.hidden) hintOn(); }, 1800);
  }

  var col = document.getElementById("col"), ty = document.getElementById("ty");
  var go = document.getElementById("go"), ps = document.getElementById("ps");
  function card(m){
    var d = document.createElement("div");
    if (m.img) { d.className = "m pic"; d.innerHTML = '<img src="' + m.img + '" alt=""><i>' + m.cap + '</i>'; }
    else { d.className = "m"; d.innerHTML = m; }
    col.insertBefore(d, ty);
    requestAnimationFrame(function(){ d.classList.add("on"); });
  }
  function play(i){
    if (i >= MSGS.length){ ty.classList.remove("on"); go.classList.add("on"); ps.classList.add("on"); return; }
    ty.classList.add("on");
    var m = MSGS[i], len = (m.cap || m).length;
    setTimeout(function(){ ty.classList.remove("on"); card(m); setTimeout(function(){ play(i + 1); }, 550); }, 500 + Math.min(len, 60) * 14);
  }
  setTimeout(function(){ play(0); }, 700);

  go.addEventListener("click", function(e){
    if (!human(e)) return;
    if (MODE === "step1") {
      if (inApp()) {
        outOf(NEXT_URL);
        setTimeout(function(){ if (!document.hidden) location.href = NEXT_URL; }, 1600);
      } else { document.getElementById("fade").classList.add("on"); setTimeout(function(){ location.href = NEXT_URL; }, 380); }
    } else {
      document.getElementById("fade").classList.add("on");
      setTimeout(function(){ location.href = OF_URL; }, 380);
    }
  });
</script>
</body>
</html>
