<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>alisa 🖤</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🖤</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,400;0,600;0,800;1,400&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #17141a;
    --ink: #ece6f0;
    --bubble: #242028;
    --accent: #b32b6e;
    --accent-dark: #8f1f57;
    --blue: #3a3345;
    --blue-dark: #2c2733;
    --blue-ink: #e8dcf0;
    --peach: #2a2230;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: "Nunito", "Helvetica Neue", Arial, sans-serif;
    background:
      radial-gradient(circle at 15% 10%, rgba(179,43,110,.12), transparent 40%),
      radial-gradient(circle at 85% 90%, rgba(120,90,150,.18), transparent 45%),
      var(--paper);
    color: var(--ink);
    overflow: hidden;
  }
  .chat {
    position: fixed; inset: 0;
    display: flex; flex-direction: column; justify-content: center;
    max-width: 470px; margin: 0 auto;
    padding: 28px 22px;
  }
  .who {
    display: flex; align-items: center; gap: 12px;
    margin-bottom: 26px;
    animation: pop .5s cubic-bezier(.34,1.56,.64,1) both;
  }
  .ava {
    width: 46px; height: 46px; border-radius: 50%;
    background: var(--blue); color: var(--blue-ink);
    display: flex; align-items: center; justify-content: center;
    font-family: "Caveat", cursive; font-size: 22px; font-weight: 700;
    box-shadow: 0 4px 12px rgba(60,50,70,.5);
  }
  .who .name { font-weight: 800; font-size: 16px; }
  .who .status { font-size: 12.5px; opacity: .55; }
  .who .status i { font-style: normal; color: #3cab5a; }

  .bubble {
    background: var(--bubble);
    border-radius: 20px; border-bottom-left-radius: 6px;
    padding: 13px 18px;
    max-width: 88%;
    box-shadow: 0 3px 14px rgba(0,0,0,.35);
    margin-bottom: 12px;
    font-size: 16.5px; line-height: 1.45;
    opacity: 0; transform: translateY(14px) scale(.96);
  }
  .bubble.show { animation: pop .45s cubic-bezier(.34,1.56,.64,1) both; }
  .bubble b { font-weight: 800; }
  .bubble .hand { font-family: "Caveat", cursive; font-size: 22px; font-weight: 500; }
  @keyframes pop {
    from { opacity: 0; transform: translateY(14px) scale(.96); }
    to   { opacity: 1; transform: none; }
  }

  .typing {
    display: inline-flex; gap: 5px; align-items: center;
    background: var(--bubble);
    border-radius: 20px; border-bottom-left-radius: 6px;
    padding: 16px 18px; margin-bottom: 12px;
    box-shadow: 0 3px 14px rgba(0,0,0,.35);
  }
  .typing span {
    width: 7px; height: 7px; border-radius: 50%;
    background: #6b6274;
    animation: blink 1.1s infinite;
  }
  .typing span:nth-child(2) { animation-delay: .18s; }
  .typing span:nth-child(3) { animation-delay: .36s; }
  @keyframes blink { 0%,70%,100% { opacity: .3; } 35% { opacity: 1; transform: translateY(-2px); } }

  .photo {
    padding: 8px;
    background: #201c24; border-radius: 16px;
    box-shadow: 0 6px 20px rgba(0,0,0,.5);
    transform: rotate(-1.6deg);
    max-width: 246px;
    margin: 4px 0 16px;
    opacity: 0;
  }
  .photo.show { animation: pop .5s cubic-bezier(.34,1.56,.64,1) both; }
  .photo img {
    width: 100%; height: 220px; object-fit: cover; object-position: center 20%;
    border-radius: 10px; display: block;
  }
  .photo .cap {
    font-family: "Caveat", cursive; font-size: 19px; text-align: center;
    padding: 6px 2px 2px; opacity: .8;
  }

  .btn {
    align-self: flex-start;
    background: var(--accent); color: #fff0f6;
    border: none; cursor: pointer; font-family: inherit;
    font-size: 17px; font-weight: 800;
    padding: 16px 34px; border-radius: 999px;
    box-shadow: 0 8px 22px rgba(179,43,110,.4);
    transition: transform .2s, background .2s, box-shadow .2s;
    opacity: 0;
  }
  .btn.show { animation: pop .5s cubic-bezier(.34,1.56,.64,1) both; }
  .btn:hover { background: var(--accent-dark); transform: translateY(-2px); box-shadow: 0 12px 26px rgba(179,43,110,.45); }
  .btn:active { transform: translateY(0); }
  .ps {
    font-family: "Caveat", cursive; font-size: 19px;
    margin-top: 14px; opacity: 0; color: var(--ink);
  }
  .ps.show { animation: pop .5s .15s cubic-bezier(.34,1.56,.64,1) both; opacity: 0; }

  .hint {
    position: fixed; top: 0; left: 0; right: 0; z-index: 10;
    background: var(--accent); color: #fff0f6;
    font-size: 14px; font-weight: 700; text-align: center;
    padding: 12px 44px 12px 16px;
    transform: translateY(-110%); transition: transform .35s;
  }
  .hint.on { transform: none; }
  .hint .arrow { position: absolute; right: 14px; top: 8px; font-size: 20px; }

  .fadeout {
    position: fixed; inset: 0; z-index: 20; background: #000;
    opacity: 0; pointer-events: none; transition: opacity .45s;
  }
  .fadeout.on { opacity: 1; }
</style>
</head>
<body>

<div class="chat">
  <div class="who">
    <div class="ava">A</div>
    <div>
      <div class="name">alisa 🖤</div>
      <div class="status"><i>●</i> online</div>
    </div>
  </div>

  <div class="typing" id="typing"><span></span><span></span><span></span></div>

  <div class="bubble" id="b1">okay listen 👀</div>
  <div class="bubble" id="b2">I think I found something u might like&hellip;<br>honestly not like anything else out there 🥹</div>
  <div class="photo" id="ph">
    <img src="photo1.jpg" alt="" style="object-position: center 15%;">
    <div class="cap">look at this vibe ↑</div>
  </div>
  <div class="bubble" id="b3">u might wanna check it out yourself. trust&nbsp;me&nbsp;🤞</div>

  <button class="btn" id="seeBtn" type="button">okay, show me 🖤</button>
  <div class="ps" id="ps">&hellip;you&rsquo;ll thank me later.</div>
</div>

<div class="hint" id="openHint">tap ⋯ and choose “Open in external browser” 🖤<span class="arrow">↗</span></div>
<div class="fadeout" id="fadeout"></div>

<script>
  /* ════════════════════════════════════════════════
     ВОТ ЭТА СТРОЧКА — куда ведёт страница.
     Поменялся магазин → меняешь адрес в кавычках.
     ════════════════════════════════════════════════ */
  var STORE_URL = "https://onlyfans.com/alisa_tempt/c22";

  // Выход из встроенного браузера Instagram в настоящий (там человек
  // залогинен в OF). Android — Chrome через intent, iPhone — x-safari-схема;
  // если Instagram её зарезал, через 1.5с показываем подсказку «⋯ → Open in browser».
  (function escapeInApp() {
    var ua = navigator.userAgent || "";
    if (!/Instagram|FBAN|FBAV/i.test(ua)) return;
    var bare = location.href.replace(/^https?:\/\//, "");
    if (/Android/i.test(ua)) {
      location.href = "intent://" + bare + "#Intent;scheme=https;package=com.android.chrome;end";
    } else if (/iPhone|iPad|iPod/i.test(ua)) {
      // Попытка 1 — Safari; не ушли со страницы за 0.8с → попытка 2 — Chrome.
      location.href = "x-safari-https://" + bare;
      setTimeout(function () {
        if (!document.hidden) location.href = "googlechromes://" + bare;
      }, 800);
    }
    setTimeout(function () {
      if (!document.hidden) document.getElementById("openHint").classList.add("on");
    }, 1800);
  })();

  // Защита от ботов: пропускаем только настоящие клики живого человека.
  function realHuman(e) {
    if (navigator.webdriver) return false;
    if (!e || e.isTrusted !== true) return false;
    return true;
  }

  // Сообщения появляются по очереди, как в настоящей переписке
  var steps = ["b1", "b2", "ph", "b3"];
  var typing = document.getElementById("typing");
  var i = 0;
  function next() {
    if (i >= steps.length) {
      typing.style.display = "none";
      document.getElementById("seeBtn").classList.add("show");
      document.getElementById("ps").classList.add("show");
      return;
    }
    var el = document.getElementById(steps[i]);
    typing.style.display = "none";
    el.classList.add("show");
    el.parentNode.insertBefore(typing, el.nextSibling.nextSibling || null);
    i++;
    if (i < steps.length) {
      setTimeout(function () { typing.style.display = "inline-flex"; }, 250);
    }
    setTimeout(next, 950);
  }
  setTimeout(next, 900);

  document.getElementById("seeBtn").addEventListener("click", function (e) {
    if (!realHuman(e)) return;
    document.getElementById("fadeout").classList.add("on");
    setTimeout(function () { window.location.href = STORE_URL; }, 420);
  });
</script>
</body>
</html>
